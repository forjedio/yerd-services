name: release

# Build (or remove) ONE (service, version) and publish to the rolling `services`
# release. Manually dispatched (or callable by an agent). See README.md.
#
# Atomic publish: build legs only emit per-platform GitHub Actions *artifacts*;
# the single `finalize` job (which runs only when ALL legs succeed) downloads them
# and uploads every platform to the release together, then regenerates the listing.
# So a partial build failure publishes NOTHING and leaves the live release
# untouched — the listing always reflects reality.
on:
  workflow_dispatch:
    inputs:
      action:
        description: build (add/replace) or remove (delete) a (service, version)
        type: choice
        required: true
        default: build
        options: [build, remove]
      service:
        description: service id (valkey is the friendly alias for the redis slot)
        type: choice
        required: true
        default: valkey
        options: [valkey, redis, mysql, mariadb, postgres, meilisearch, versitygw]
      version:
        description: the published label users install (e.g. 8, 8.4, 16)
        type: string
        required: true
      upstream:
        description: exact upstream source tag to build from (e.g. 9.1.0). Ignored for remove.
        type: string
        required: false
        default: ""
      targets:
        description: >-
          which platform(s) to build (default all). Pick a single target to rebuild just
          that platform — already-published platforms are untouched and the manifest merges.
        type: choice
        required: true
        default: all
        options: [all, linux-x86_64, linux-aarch64, macos-aarch64, windows-x86_64]
      redis_win_upstream:
        description: >-
          redis slot only — Windows ships the native MSVC Redis port (Valkey doesn't build
          on Windows), so its version is independent of the Valkey `upstream`. Default pinned.
        type: string
        required: false
        default: "5.0.14.1"
      postgres_win_buildno:
        description: >-
          postgres slot only — EDB windows-x64 binaries build-number suffix (e.g. 1).
          Leave empty to probe. Ignored by other services/platforms.
        type: string
        required: false
        default: ""
      postgis_win_upstream:
        description: >-
          postgres slot only — pin the Windows PostGIS bundle version (e.g. 3.6.2) for the
          `full` variant. Leave empty to auto-discover the latest OSGeo bundle. Ignored by
          other services/platforms.
        type: string
        required: false
        default: ""
      timescaledb_upstream:
        description: >-
          postgres slot only — pin the TimescaleDB version (e.g. 2.28.3) bundled into the unix
          `full` variant (PG 15-18 only). Leave empty for the recipe default. Ignored by other
          services/platforms.
        type: string
        required: false
        default: ""

# Serialize whole runs so two dispatches can't race on services.json.
concurrency:
  group: services-release
  cancel-in-progress: false

# Publish to this repo's own releases; default token is enough (no PAT).
permissions:
  contents: write

# Workflow-level env propagates to every job/step (incl. each matrix leg). GH_TOKEN
# and GH_REPO are the canonical vars the gh CLI reads, so gh auth works everywhere.
env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: services
  # Windows redis ships the native MSVC Redis port (platform-divergent from the Valkey
  # `upstream`); postgres needs the EDB build-number suffix (empty -> probe). Both are
  # ignored by non-Windows legs / non-matching services. Read by build-service.sh / lib.sh.
  REDIS_WIN_UPSTREAM: ${{ inputs.redis_win_upstream }}
  POSTGRES_WIN_BUILDNO: ${{ inputs.postgres_win_buildno }}
  # postgres `full` variant on Windows: pin the OSGeo PostGIS bundle version, or leave empty
  # to auto-discover the latest (OSGeo hosts only the current bundle per pg major).
  POSTGIS_WIN_UPSTREAM: ${{ inputs.postgis_win_upstream }}
  # postgres `full` variant on unix: pin the TimescaleDB version (empty -> recipe default).
  TIMESCALEDB_UPSTREAM: ${{ inputs.timescaledb_upstream }}

jobs:
  # Create the rolling release once if missing. Runs in parallel with build; finalize
  # waits on it before touching the release.
  ensure-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure the rolling release exists
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
                 --title "yerd services" \
                 --notes "Rolling release of yerd service binaries. Assets are managed by the release workflow; see services.json for the live listing."
      - name: Drop the legacy index.html listing if present
        # The listing is now services.json; remove any leftover index.html.
        run: gh release delete-asset "$RELEASE_TAG" index.html --yes || true

  # Compute the build matrix from the `targets` input so a single platform can be rebuilt
  # without touching the others. The full set is the source of truth here; `targets=all`
  # (default) yields every platform, otherwise just the one selected target.
  #   macOS x86_64 is intentionally absent: GitHub retired the last Intel macOS image
  #   (macos-13) in Dec 2025, and macos-14/15 are arm64-only.
  #   Windows is x86_64-only: no service has a native Windows ARM64 upstream binary, and
  #   Windows-on-ARM runs x64 via built-in emulation.
  set-matrix:
    if: ${{ inputs.action == 'build' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - id: gen
        run: |
          all='[{"runner":"ubuntu-latest","target":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","target":"linux-aarch64"},{"runner":"macos-14","target":"macos-aarch64"},{"runner":"windows-latest","target":"windows-x86_64"}]'
          # Every service now covers all four platforms: meilisearch builds from Rust source on
          # windows-latest (emitting meilisearch.exe) and versitygw repackages upstream's prebuilt
          # Windows binary — so there is no per-service Windows drop here anymore. A single target
          # can still be rebuilt in isolation via the `targets` input below (e.g. windows-x86_64).
          if [[ "${{ inputs.targets }}" == "all" ]]; then
            inc="$(jq -c '.' <<<"$all")"
          else
            inc="$(jq -c --arg t "${{ inputs.targets }}" '[.[] | select(.target == $t)]' <<<"$all")"
          fi
          [[ "$(jq 'length' <<<"$inc")" -ge 1 ]] \
            || { echo "set-matrix: no platform matched targets='${{ inputs.targets }}' for service='${{ inputs.service }}'" >&2; exit 1; }
          echo "selected targets: $inc"
          echo "matrix={\"include\":$inc}" >> "$GITHUB_OUTPUT"

  build:
    needs: set-matrix
    if: ${{ inputs.action == 'build' }}
    # Run every build step under bash. Default on Linux/macOS already; on windows-latest
    # this selects Git Bash so the same scripts run. Scoped to this job, so the
    # set-matrix/finalize/ensure-release jobs are untouched.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.set-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # No separate dep-install step: build-service.sh self-provisions what it needs on
      # Linux (patchelf for relocation; libaio for the MySQL repackage), root-aware, so it
      # works the same whether run here or standalone.
      - name: Build artifact for ${{ matrix.target }}
        run: |
          scripts/build-service.sh "${{ inputs.service }}" "${{ inputs.version }}" "${{ inputs.upstream }}"
      - name: De-mask geo libs before smoke (postgres full, LINUX only)
        # The postgres `full` build apt-installs GEOS/PROJ/GDAL; on Linux, leaving them installed
        # lets ld.so.cache satisfy the artifact's deps, masking a broken bundle and turning smoke
        # falsely green — so remove them (autoremove is essential: removing just the -dev packages
        # leaves the auto-installed runtime .so packages, and the mask, behind). LINUX ONLY:
        # macOS dyld resolves @rpath against the binary's own LC_RPATH (pointed into the bundle by
        # macos_make_relocatable, with macos_self_contain_gate proving zero /opt/homebrew refs at
        # build time) — there is no global cache to fall back to, so brew geo can't mask anything
        # and uninstalling it is both unnecessary and fragile on the runner.
        if: ${{ inputs.service == 'postgres' && startsWith(matrix.target, 'linux') }}
        run: |
          sudo apt-get remove -y libgeos-dev libproj-dev libgdal-dev >/dev/null 2>&1 || true
          sudo apt-get autoremove -y >/dev/null 2>&1 || true
          ! ldconfig -p | grep -qE 'libgdal|libproj\.|libgeos_c' \
            || { echo "de-mask: system geo runtime libs still present" >&2; exit 1; }
      - name: Smoke-test the artifact(s)
        # Extract each packed tarball to a throwaway dir, start the server, run SELECT 1 (+ the
        # extension/PostGIS checks). A failed healthcheck fails the leg → finalize skips → nothing
        # publishes. Loop because a postgres build now emits TWO tarballs (base + `-full`), and
        # smoke-test.sh takes exactly one at a time.
        run: |
          for t in dist/*.tar.gz; do
            scripts/smoke-test.sh "${{ inputs.service }}" "$t"
          done
      - name: Stage the one produced artifact for atomic publish
        # Emit it as a workflow artifact rather than uploading to the release, so a
        # partial-matrix failure never half-publishes to the live release.
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [ensure-release, build]
    # Run only when the release exists AND either every build leg succeeded (atomic
    # publish) or this is a remove (build is skipped). A partial build failure ->
    # build.result == 'failure' -> finalize skipped -> nothing was published.
    if: >-
      ${{ always()
          && needs.ensure-release.result == 'success'
          && (needs.build.result == 'success'
              || (needs.build.result == 'skipped' && inputs.action == 'remove')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts (action == build)
        if: ${{ inputs.action == 'build' }}
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          merge-multiple: true
          path: dist

      - name: Publish all platform binaries together (action == build)
        if: ${{ inputs.action == 'build' }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no artifacts downloaded to publish" >&2; exit 1
          fi
          # All platforms land before any listing change; --clobber replaces same-named assets.
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber

      - name: Remove a version's assets (action == remove)
        if: ${{ inputs.action == 'remove' }}
        run: |
          # Canonicalize so service=valkey addresses redis-* assets.
          source scripts/lib.sh
          svc="$(canonical_service "${{ inputs.service }}")"
          ver="${{ inputs.version }}"
          # A single postgres `build` emits both `<ver>` and the `<ver>-full` variant, so remove
          # must sweep both labels or it orphans the sibling. The extra labels are harmless no-ops
          # (|| true) for services that don't produce them.
          vers=("$ver")
          [[ "$svc" == postgres ]] && vers+=("${ver}-full")
          # Sweep every possible os/arch combo. We don't publish macos-x86_64 or
          # windows-aarch64, but deleting them anyway is harmless (|| true) and cleans
          # any legacy asset.
          for v in "${vers[@]}"; do
            for os in linux macos windows; do
              for arch in x86_64 aarch64; do
                name="$(artifact_filename "$svc" "$v" "$os" "$arch")"
                gh release delete-asset "$RELEASE_TAG" "$name" --yes || true
              done
            done
          done

      - name: Regenerate services.json from the live asset set
        run: |
          # The listing is services.json, derived from the release's live *.tar.gz assets.
          gh release view "$RELEASE_TAG" --json assets -q '.assets[].name' \
            | { grep '\.tar\.gz$' || true; } | LC_ALL=C sort > names.txt
          scripts/gen-manifest.sh < names.txt > services.json
          gh release upload "$RELEASE_TAG" services.json --clobber

  # Mirror the just-published (or just-removed) state to BunnyCDN. ADDITIVE for build,
  # scoped-destructive for remove; wholesale pruning is the manual cdn-sync.yml's job.
  # NON-FATAL: GitHub Releases stays the source of truth (README's "URLs the consumer
  # hard-codes"), so a CDN hiccup must never fail a release — cdn-sync.yml heals any
  # partial mirror.
  #
  # CDN layout (see README's "CDN mirror"):
  #   services/<service>-<version>-<os>-<arch>.tar.gz   flat, no history
  #   services/services.json                            contract copy: SERVICES_BASE_URL
  #                                                     = https://<pullzone>/services works
  #                                                     unchanged for BOTH the listing and
  #                                                     the artifacts
  #   services.json                                     zone-root copy, for browsing/tooling
  cdn-mirror:
    needs: finalize
    # `needs:` already gates on finalize succeeding; spelling it out makes the four cases
    # legible: build/all-pass -> runs; build/one-leg-fails -> finalize skipped -> skipped;
    # remove -> finalize's always() passes -> runs; cancelled -> skipped.
    if: ${{ !cancelled() && needs.finalize.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    # Narrower than the workflow's contents:write — this job only reads the release.
    permissions:
      contents: read
    # No job-level concurrency group needed: the whole run already holds the constant
    # top-level `services-release` group, which cdn-sync.yml shares, so a manual sync and
    # an automatic mirror can never interleave writes to the root manifest.
    env:
      BUNNY_STORAGE_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_ACCESS_KEY }}
      BUNNY_PURGE_API_KEY: ${{ secrets.BUNNY_PURGE_API_KEY }}
      BUNNY_STORAGE_ZONE: ${{ vars.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_ENDPOINT: ${{ vars.BUNNY_STORAGE_ENDPOINT }}
      PULLZONE: ${{ vars.BUNNY_PULLZONE_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The paginated assets endpoint is MANDATORY, not future-proofing: the REST
      # default is per_page=30 and this release already holds more assets than that,
      # so an un-paginated read silently truncates. gh merges the pages into one array.
      - name: Snapshot the live asset set
        id: snapshot
        run: |
          set -euo pipefail
          : "${PULLZONE:?BUNNY_PULLZONE_HOST is not set}"
          id="$(gh api "repos/${GH_REPO}/releases/tags/${RELEASE_TAG}" -q .id)"
          gh api --paginate "repos/${GH_REPO}/releases/${id}/assets" > assets.json
          jq -r '.[] | select(.state=="uploaded") | .name' assets.json \
            | { grep '\.tar\.gz$' || true; } | LC_ALL=C sort > names.txt
          echo "live uploaded tarballs: $(wc -l < names.txt)"

      # Enumerate this dispatch's (service, version) artifact names exactly as finalize's
      # remove sweep does (same lib.sh helpers), so the postgres base+`-full` pair and the
      # valkey->redis alias are handled by the code that defines them.
      #   touched_build - filtered by inputs.targets, so a single-platform rebuild moves and
      #                   purges only that platform (up to 8 objects / ~800MB for postgres).
      #   touched_all   - the full os x arch cross-product. The remove branch MUST use this:
      #                   finalize's sweep is target-agnostic, so filtering here would leave
      #                   CDN objects serving artifacts that no longer exist on the release.
      - name: Enumerate touched artifact names
        run: |
          set -euo pipefail
          source scripts/lib.sh
          svc="$(canonical_service "${{ inputs.service }}")"
          ver="${{ inputs.version }}"
          vers=("$ver")
          [[ "$svc" == postgres ]] && vers+=("${ver}-full")
          : > touched_all.txt
          : > touched_build.txt
          want="${{ inputs.targets }}"
          for v in "${vers[@]}"; do
            for os in linux macos windows; do
              for arch in x86_64 aarch64; do
                name="$(artifact_filename "$svc" "$v" "$os" "$arch")"
                echo "$name" >> touched_all.txt
                if [[ "$want" == "all" || "$want" == "${os}-${arch}" ]]; then
                  echo "$name" >> touched_build.txt
                fi
              done
            done
          done
          LC_ALL=C sort -o touched_all.txt touched_all.txt
          LC_ALL=C sort -o touched_build.txt touched_build.txt

      # BUILD: upload artifacts -> publish manifest -> purge (artifacts first, then the
      # manifest URLs). Artifacts before the manifest so the manifest never names an object
      # that is not there yet; artifacts purged before it too, so a URL negatively cached by
      # a pre-upload probe cannot 404 while the manifest advertises it.
      - name: Mirror artifacts + manifest (action == build)
        id: build_mirror
        if: ${{ inputs.action == 'build' }}
        run: |
          set -euo pipefail
          source scripts/lib.sh
          put="scripts/bunny-put.sh"
          LC_ALL=C comm -12 touched_build.txt names.txt > upload.txt
          [[ -s upload.txt ]] || { echo "no touched artifact is live on the release" >&2; exit 1; }
          : > purge_urls.txt
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            gh release download "$RELEASE_TAG" --pattern "$name" --dir mirror --clobber
            dig="$(jq -r --arg n "$name" \
              '.[] | select(.name==$n) | (.digest // "") | sub("^sha256:";"")' assets.json)"
            # noheader: no header to send, so verify the bytes locally instead — that cell
            # would otherwise have no content verification at all (the post-PUT check is a
            # ranged existence GET).
            if [[ "$CDN_CHECKSUM_MODE" == noheader ]]; then
              if [[ -n "$dig" ]]; then
                echo "${dig}  mirror/${name}" | sha256sum -c - >/dev/null \
                  || { echo "::error::local digest mismatch for $name" >&2; exit 1; }
              fi
              bash "$put" "mirror/$name" "services/$name"
            else
              bash "$put" "mirror/$name" "services/$name" "$dig"
            fi
            echo "https://${PULLZONE}/services/${name}" >> purge_urls.txt
          done < upload.txt
          # The manifest finalize just published, in this same serialized run.
          gh release download "$RELEASE_TAG" --pattern services.json --dir mf --clobber
          mdig="$(jq -r '.[] | select(.name=="services.json") | (.digest // "") | sub("^sha256:";"")' assets.json)"
          if [[ "$CDN_CHECKSUM_MODE" == noheader ]]; then
            bash "$put" mf/services.json services/services.json
            bash "$put" mf/services.json services.json
          else
            bash "$put" mf/services.json services/services.json "$mdig"
            bash "$put" mf/services.json services.json "$mdig"
          fi
          {
            echo "https://${PULLZONE}/services/services.json"
            echo "https://${PULLZONE}/services.json"
          } >> purge_urls.txt
          xargs -a purge_urls.txt bash scripts/bunny-purge.sh

      # REMOVE: publish the shrunken manifest -> PURGE IT -> delete objects -> purge those.
      # The purge before the deletes is load-bearing: a PUT alone does not stop the edge
      # serving the old listing, so deleting first would leave a window where the edge
      # advertises a version whose artifacts already 404.
      - name: Unmirror a version (action == remove)
        id: remove_mirror
        if: ${{ inputs.action == 'remove' }}
        run: |
          set -euo pipefail
          source scripts/lib.sh
          put="scripts/bunny-put.sh"
          # finalize deletes the assets and THEN regenerates services.json as its last step,
          # so this download is already the post-remove listing.
          gh release download "$RELEASE_TAG" --pattern services.json --dir mf --clobber
          mdig="$(jq -r '.[] | select(.name=="services.json") | (.digest // "") | sub("^sha256:";"")' assets.json)"
          if [[ "$CDN_CHECKSUM_MODE" == noheader ]]; then
            bash "$put" mf/services.json services/services.json
            bash "$put" mf/services.json services.json
          else
            bash "$put" mf/services.json services/services.json "$mdig"
            bash "$put" mf/services.json services.json "$mdig"
          fi
          bash scripts/bunny-purge.sh \
            "https://${PULLZONE}/services/services.json" \
            "https://${PULLZONE}/services.json"
          # Intersect with the real listing so bunny-delete.sh is never handed a path that
          # does not exist (no 404-tolerance hack needed for never-mirrored platforms).
          bash scripts/bunny-list.sh services/ > listing.json
          jq -r '.[] | .path | sub("^services/";"")' listing.json | LC_ALL=C sort > present.txt
          LC_ALL=C comm -12 touched_all.txt present.txt > delete.txt
          : > deleted_urls.txt
          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            bash scripts/bunny-delete.sh "services/$name"
            echo "https://${PULLZONE}/services/${name}" >> deleted_urls.txt
          done < delete.txt
          if [[ -s deleted_urls.txt ]]; then
            xargs -a deleted_urls.txt bash scripts/bunny-purge.sh
          else
            echo "nothing to delete on the CDN for this version"
          fi

      # Outcome summary FIRST, unconditional and network-free (mirrors yerd's Summarize),
      # so a run with the Bunny secrets unset still explains itself. The coverage check runs
      # afterwards as a separate best-effort step.
      - name: Summarize
        if: always()
        env:
          SNAPSHOT: ${{ steps.snapshot.outcome }}
          BUILD_MIRROR: ${{ steps.build_mirror.outcome }}
          REMOVE_MIRROR: ${{ steps.remove_mirror.outcome }}
        run: |
          {
            if [ "$BUILD_MIRROR" = "success" ] || [ "$REMOVE_MIRROR" = "success" ]; then
              echo "### CDN mirror updated"
              echo ""
              echo "- action: \`${{ inputs.action }}\` / service: \`${{ inputs.service }}\` / version: \`${{ inputs.version }}\`"
              echo "- layout: \`services/\` + \`services/services.json\` + root \`services.json\`"
              echo "- consumer base: \`https://${PULLZONE}/services\`"
            else
              echo "### CDN mirror did not complete"
              echo ""
              echo "- snapshot: ${SNAPSHOT} / build-mirror: ${BUILD_MIRROR} / remove-mirror: ${REMOVE_MIRROR}"
              echo "- GitHub Releases remains the source of truth; run \`cdn-sync.yml\` to reconcile."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Best-effort coverage check. Basis differs per action: on build, the assets that
      # actually exist on the release (touched_all n names.txt — NOT touched_build, or a
      # single-target rebuild would never notice a missing sibling platform); on remove, the
      # inverse assertion that nothing survives. Never fails the step.
      - name: Coverage check
        if: ${{ always() && steps.snapshot.outcome == 'success' }}
        run: |
          set -uo pipefail
          # `Enumerate touched artifact names` has no id, so nothing gates this step on it;
          # without the -s test a missing touched_all.txt would make comm produce an empty
          # diff and this step would print "Coverage: OK." right under a failure summary.
          [ -s touched_all.txt ] || {
            echo "_(coverage check unavailable: no touched-name list)_" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          bash scripts/bunny-list.sh services/ > post.json 2>/dev/null || {
            echo "_(coverage check unavailable)_" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          jq -r '.[] | .path | sub("^services/";"")' post.json | LC_ALL=C sort > post.txt
          if [ "${{ inputs.action }}" = "build" ]; then
            # Basis is the UNFILTERED asset names, not names.txt. names.txt is state-filtered,
            # and so is the upload loop, so deriving the expectation from it too would let the
            # two filters hide each other: an asset momentarily not `uploaded` is skipped by the
            # mirror AND invisible here, while finalize's unfiltered manifest still advertises it.
            jq -r '.[].name' assets.json | { grep '\.tar\.gz$' || true; } | LC_ALL=C sort > all_names.txt
            LC_ALL=C comm -12 touched_all.txt all_names.txt > expect.txt
            missing="$(LC_ALL=C comm -23 expect.txt post.txt)"
            label="expected on the CDN but absent"
          else
            missing="$(LC_ALL=C comm -12 touched_all.txt post.txt)"
            label="should have been deleted but remain"
          fi
          if [ -n "$missing" ]; then
            { echo ""; echo "<details><summary>Coverage: objects ${label}</summary>"; echo ""
              printf '%s\n' "$missing" | sed 's/^/- `/;s/$/`/'
              echo ""; echo "</details>"
              echo ""; echo "_Run \`cdn-sync.yml\` to reconcile._"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            { echo ""; echo "Coverage: OK."; } >> "$GITHUB_STEP_SUMMARY"
          fi
